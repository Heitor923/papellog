name: CD - PapelLog

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    name: Validar Django antes da publicacao
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: papellog_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d papellog_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SECRET_KEY: chave-descartavel-exclusiva-para-ci
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: papellog_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar migracoes e testes
        working-directory: backend
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py test

  publicar:
    name: Construir e publicar imagem no GHCR
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.versao.outputs.image }}
      tag: ${{ steps.versao.outputs.tag }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Conferir Dockerfile
        run: |
          if [ ! -f Dockerfile ]; then
            echo "ERRO: aguarde o Dockerfile da pessoa responsavel por Docker na raiz do repositorio."
            exit 1
          fi

      - name: Definir nome e versao da imagem
        id: versao
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERRO: use tags semanticas como v1.0.0"
              exit 1
            fi
          else
            TAG="sha-${GITHUB_SHA::12}"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Autenticar no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.versao.outputs.image }}:${{ steps.versao.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  homologacao:
    name: Deploy automatico em homologacao temporaria
    needs: publicar
    runs-on: ubuntu-latest
    environment: homologacao
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REF: ${{ needs.publicar.outputs.image }}:${{ needs.publicar.outputs.tag }}
      HOMOLOG_SECRET_KEY: ${{ secrets.HOMOLOG_SECRET_KEY }}
      HOMOLOG_DB_PASSWORD: ${{ secrets.HOMOLOG_DB_PASSWORD }}
    steps:
      - name: Verificar secrets de homologacao
        shell: bash
        run: |
          if [ -z "$HOMOLOG_SECRET_KEY" ] || [ -z "$HOMOLOG_DB_PASSWORD" ]; then
            echo "ERRO: configure HOMOLOG_SECRET_KEY e HOMOLOG_DB_PASSWORD no environment homologacao."
            exit 1
          fi

      - name: Autenticar no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Iniciar PostgreSQL temporario
        shell: bash
        run: |
          docker network create papellog-homolog
          docker run -d \
            --name papellog-db \
            --network papellog-homolog \
            -e POSTGRES_DB=papellog_homolog \
            -e POSTGRES_USER=papellog \
            -e POSTGRES_PASSWORD="$HOMOLOG_DB_PASSWORD" \
            --health-cmd='pg_isready -U papellog -d papellog_homolog' \
            --health-interval=5s --health-timeout=5s --health-retries=20 \
            postgres:16
          for tentativa in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' papellog-db)" = "healthy" ]; then
              echo "PostgreSQL pronto"
              exit 0
            fi
            sleep 2
          done
          echo "ERRO: PostgreSQL nao ficou pronto"
          exit 1

      - name: Baixar imagem publicada e executar Django
        shell: bash
        run: |
          docker pull "$IMAGE_REF"
          docker run -d \
            --name papellog-web \
            --network papellog-homolog \
            -p 127.0.0.1:8000:8000 \
            -e SECRET_KEY="$HOMOLOG_SECRET_KEY" \
            -e DEBUG=False \
            -e ALLOWED_HOSTS='localhost,127.0.0.1' \
            -e DB_NAME=papellog_homolog \
            -e DB_USER=papellog \
            -e DB_PASSWORD="$HOMOLOG_DB_PASSWORD" \
            -e DB_HOST=papellog-db \
            -e DB_PORT=5432 \
            -e SECURE_SSL_REDIRECT=False \
            -e SESSION_COOKIE_SECURE=False \
            -e CSRF_COOKIE_SECURE=False \
            "$IMAGE_REF"

      - name: Aplicar migracoes na homologacao
        shell: bash
        run: |
          docker exec papellog-web sh -c '
            if [ -f /app/backend/manage.py ]; then
              python /app/backend/manage.py migrate --noinput
            elif [ -f /app/manage.py ]; then
              python /app/manage.py migrate --noinput
            else
              echo "ERRO: manage.py nao encontrado na imagem."
              exit 1
            fi
          '

      - name: Verificar aplicacao HTTP
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 3 --retry-connrefused \
            --max-time 5 \
            http://127.0.0.1:8000/web/login/ > /dev/null
          echo "Deploy validado: Django respondeu em /admin/login/"

      - name: Mostrar logs se houver falha
        if: failure()
        run: |
          docker ps -a || true
          docker logs --tail=100 papellog-db || true
          docker logs --tail=100 papellog-web || true
