name: CI - PapelLog

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    
    # Isso injeta o Secret que criamos no Passo 1 para todos os steps deste job
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' 

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 
          # Se os requirements estiverem dentro da pasta backend, mude para: pip install -r backend/requirements.txt

      - name: Executar migrações
        run: |
          # Pelo erro da imagem 2, parece que o seu projeto fica dentro de uma pasta backend
          cd backend 
          python manage.py migrate
