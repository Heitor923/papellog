{% extends 'base.html' %}
{% block page_title %}Editar Produto{% endblock %}
{% block conteudo %}

<div class="page-header">
  <div class="page-header-left">
    <h2>Editar Produto</h2>
    <p>Atualize os dados do produto</p>
  </div>
  <a href="/web/produtos/" class="btn btn-ghost"><i class="bi bi-arrow-left"></i> Voltar</a>
</div>

<div class="card" style="max-width:640px;">
  <div class="card-header"><i class="bi bi-box-seam"></i> {{ produto.nome }}</div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Nome</label>
          <input type="text" name="nome" class="form-control" value="{{ produto.nome }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">SKU</label>
          <input type="text" name="sku" class="form-control td-mono" value="{{ produto.sku }}" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Descrição</label>
        <textarea name="descricao" class="form-control">{{ produto.descricao }}</textarea>
      </div>
      <div class="form-row-3">
        <div class="form-group">
          <label class="form-label">Preço (R$)</label>
          <input type="number" name="preco" class="form-control" step="0.01" min="0" value="{{ produto.preco }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Estoque atual</label>
          <input type="number" name="estoqueAtual" class="form-control" min="0" value="{{ produto.estoqueAtual }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Estoque mínimo</label>
          <input type="number" name="estoqueMinimo" class="form-control" min="0" value="{{ produto.estoqueMinimo }}" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-check">
          <input type="checkbox" name="ativo" {% if produto.ativo %}checked{% endif %}> Produto ativo
        </label>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Salvar alterações</button>
        <a href="/web/produtos/" class="btn btn-ghost">Cancelar</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
