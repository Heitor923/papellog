{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — PapelLog</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <div class="login-logo-icon">
        <i class="bi bi-journal-bookmark-fill"></i>
      </div>
      <h1>PapelLog</h1>
      <p>Gestão inteligente para papelarias</p>
    </div>

    {% if erro %}
    <div class="alert alert-danger">
      <i class="bi bi-x-circle-fill"></i>
      <span>{{ erro }}</span>
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Usuário</label>
        <input type="text" name="username" class="form-control" placeholder="seu.usuario" autofocus autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          <i class="bi bi-box-arrow-in-right"></i> Entrar
        </button>
      </div>
    </form>

    <p class="text-center text-xs text-muted mt-6">
      PapelLog &copy; 2026 &mdash; Sistema de Gestão Comercial
    </p>
  </div>
</div>

</body>
</html>
